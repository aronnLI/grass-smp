<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Grass SMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #2FE04E;
            --teal: #00FFCC;
            --red: #ff5c5c;
            --bg-dark: #0b0f0e;
            --bg-card: rgba(30, 30, 46, 0.35);
            --bg-header: rgba(9, 13, 12, 0.6);
            --text-main: #e8f5ec;
            --text-muted: #9db4a5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0d1117;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.6);
            z-index: -1;
            pointer-events: none;
        }

        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; cursor: pointer; }

        /* ------- Header ------- */
        header {
            position: sticky; top: 0; left: 0; width: 100%; z-index: 100;
            background: var(--bg-header);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(47, 224, 78, 0.15);
        }

        .nav {
            max-width: 1100px; margin: 0 auto; padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; color: var(--green); }

        .logo-dot {
            width: 12px; height: 12px; border-radius: 3px;
            background: linear-gradient(135deg, var(--green), var(--teal));
            display: inline-block; animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(47, 224, 78, 0.5); }
            50% { box-shadow: 0 0 0 9px rgba(47, 224, 78, 0); }
        }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 0.92rem;
            color: var(--text-main);
            background: rgba(47, 224, 78, 0.1);
            border: 1px solid rgba(47, 224, 78, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .back-btn:hover { background: rgba(47, 224, 78, 0.18); transform: translateY(-2px); }

        /* ------- Контент корзины ------- */
        .cart-page {
            flex: 1;
            max-width: 820px; width: 100%;
            margin: 0 auto; padding: 40px 24px 80px;
        }

        .cart-page h1 {
            font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800;
            text-align: center; margin-bottom: 6px;
        }

        .cart-page .sub {
            text-align: center; color: var(--text-muted); margin-bottom: 30px;
        }

        /* карточка-обёртка */
        .cart-panel {
            background: rgba(30, 30, 46, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px; padding: 24px;
        }

        .cart-empty {
            text-align: center; color: var(--text-muted);
            padding: 40px 0; font-size: 1.1rem;
        }

        .cart-empty .big { font-size: 3rem; display: block; margin-bottom: 12px; }

        .cart-empty a {
            display: inline-block; margin-top: 20px; padding: 13px 30px; border-radius: 12px;
            font-weight: 700; color: #0b0f0e;
            background: linear-gradient(135deg, var(--green), var(--teal));
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .cart-empty a:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(47, 224, 78, 0.4);
        }

        .cart-item {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .cart-item:last-of-type { border-bottom: none; }

        .cart-item-info { flex: 1; min-width: 0; }

        .cart-item-name { font-weight: 700; font-size: 1.02rem; }
        .cart-item-meta { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }
        .cart-item-meta .sum-for { color: var(--teal); font-weight: 700; }

        .cart-item-qty { display: flex; align-items: center; gap: 8px; }

        .qty-btn {
            width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(47, 224, 78, 0.35);
            background: transparent; color: var(--green); cursor: pointer; font-size: 1.05rem;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .qty-btn:hover { background: var(--green); color: #0b0f0e; }

        .qty-num { font-weight: 800; min-width: 24px; text-align: center; }

        .cart-item-price {
            font-weight: 800; color: var(--teal); min-width: 80px; text-align: right; font-size: 1.05rem;
        }

        .cart-item-remove {
            width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer;
            background: rgba(255, 92, 92, 0.12); color: #ff8a8a;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .cart-item-remove:hover { background: var(--red); color: #0b0f0e; }

        /* итоги */
        .cart-total-box {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 0 0; margin-top: 8px;
            border-top: 2px solid rgba(47, 224, 78, 0.2);
        }

        .cart-total-box .label { font-weight: 700; font-size: 1.15rem; }

        .cart-total-box .sum {
            font-size: 1.5rem; font-weight: 800; color: var(--teal);
            font-variant-numeric: tabular-nums;
        }

        .pay-btn {
            display: block; width: 100%; margin-top: 20px; padding: 16px; border-radius: 12px;
            background: linear-gradient(135deg, var(--green), var(--teal));
            color: #0b0f0e; font-weight: 800; font-size: 1.1rem; text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pay-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(47, 224, 78, 0.45);
        }

        .pay-btn:disabled {
            opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none;
        }

        .summary-packs {
            margin-top: 18px; padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted); font-size: 0.9rem; text-align: center;
        }

        .summary-packs strong { color: var(--teal); }

        /* ------- Toast ------- */
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: linear-gradient(135deg, var(--green), var(--teal));
            color: #0b0f0e; padding: 14px 26px; border-radius: 12px;
            font-weight: 700; opacity: 0; transition: all 0.4s ease;
            z-index: 2000; box-shadow: 0 10px 30px rgba(0, 255, 204, 0.3);
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ------- Footer ------- */
        footer {
            border-top: 1px solid rgba(47, 224, 78, 0.15); padding: 30px 24px;
            background: rgba(7, 10, 9, 0.9); backdrop-filter: blur(8px);
        }

        .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        footer p { color: var(--text-muted); font-size: 0.88rem; text-align: center; }

        /* ------- Responsive ------- */
        @media (max-width: 640px) {
            .cart-panel { padding: 16px; }
            .cart-item { flex-wrap: wrap; }
            .cart-item-info { flex-basis: 100%; }
            .cart-item-qty { margin-left: auto; }
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav">
            <a href="index.html" class="logo">
                <span class="logo-dot"></span>
                GRASS SMP
            </a>
            <a href="donate.html" class="back-btn">← В магазин</a>
        </nav>
    </header>

    <main class="cart-page">
        <h1>🛒 Корзина</h1>
        <p class="sub">Проверь товары и оплати — привилегии выдадут автоматически</p>

        <div class="cart-panel" id="cartPanel">
            <!-- содержимое рендерит JS -->
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <div class="logo"><span class="logo-dot"></span> GRASS SMP</div>
            <p>© 2026 Grass SMP. Все права защищены. Не является официальным продуктом Mojang.</p>
        </div>
    </footer>

    <div class="toast" id="toast">Обновлено</div>

    <script>
        // ========== КОРЗИНА (общий доступ с donate.html) ==========
        const CART_KEY = 'grass_cart';
        const DONATION_LINK = 'https://www.donationalerts.com/r/aroncik';

        // ---- Универсальная память: localStorage, если недоступен — в памяти ----
        let memoryCart = null; // fallback, когда localStorage сломан (file:// / private)

        function getStorage() {
            try {
                localStorage.setItem('__t', '1');
                localStorage.removeItem('__t');
                return localStorage;
            } catch (e) {
                return null;
            }
        }

        function loadCart() {
            const store = getStorage();
            if (store) {
                try {
                    const raw = store.getItem(CART_KEY);
                    const parsed = raw ? JSON.parse(raw) : [];
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    return [];
                }
            }
            return memoryCart ? memoryCart : [];
        }

        function saveCart(cart) {
            const store = getStorage();
            if (store) {
                try { store.setItem(CART_KEY, JSON.stringify(cart)); return; }
                catch (e) { /* fall down to memory */ }
            }
            memoryCart = cart.slice();
        }

        // ---- DOM ----
        const cartPanel = document.getElementById('cartPanel');
        const toast = document.getElementById('toast');

        let toastTimeout;
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function renderCart() {
            let cart = loadCart();

            if (!cart.length) {
                cartPanel.innerHTML = `
                    <div class="cart-empty">
                        <span class="big">🛒</span>
                        Корзина пуста
                        <br><a href="donate.html">Перейти в магазин</a>
                    </div>`;
                return;
            }

            // сумма
            const total = cart.reduce((sum, i) => sum + Number(i.price) * Number(i.qty), 0);
            const totalQty = cart.reduce((sum, i) => sum + Number(i.qty), 0);

            // подсчёт пакетов аметистов отдельно (для сводки)
            const amethystTotal = cart
                .filter(i => String(i.id).startsWith('amethyst'))
                .reduce((sum, i) => sum + Number(i.price) * Number(i.qty), 0);

            let itemsHtml = '';
            cart.forEach(item => {
                const itemSum = Number(item.price) * Number(item.qty);
                itemsHtml += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${escapeHtml(item.name)}</div>
                            <div class="cart-item-meta">
                                ${Number(item.price)} ₽ / шт
                                ${item.qty > 1 ? `· <span class="sum-for">итого ${itemSum} ₽</span>` : ''}
                            </div>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" data-action="minus" data-id="${item.id}">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" data-action="plus" data-id="${item.id}">+</button>
                        </div>
                        <div class="cart-item-price">${itemSum} ₽</div>
                        <button class="cart-item-remove" data-action="remove" data-id="${item.id}" title="Удалить">✕</button>
                    </div>`;
            });

            let amethystLine = '';
            if (amethystTotal > 0) {
                amethystLine = `<div class="summary-packs">Из них Аметисты: <strong>${amethystTotal} ₽</strong></div>`;
            }

            cartPanel.innerHTML = `
                ${itemsHtml}
                <div class="cart-total-box">
                    <span class="label">Итого (${totalQty} шт.):</span>
                    <span class="sum" id="totalSum">${total} ₽</span>
                </div>
                ${amethystLine}
                <a href="${DONATION_LINK}" class="pay-btn" id="payBtn" target="_blank" rel="noopener noreferrer">💳 Оплатить ${total} ₽</a>`;
        }

        // маленькая защита от XSS в имени товара
        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // ---- Обработка кликов по товарам ----
        cartPanel.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const id = btn.dataset.id;
            let cart = loadCart();
            const item = cart.find(i => i.id === id);
            if (!item) return;

            if (btn.dataset.action === 'remove') {
                cart = cart.filter(i => i.id !== id);
                showToast('Товар удалён');
            } else if (btn.dataset.action === 'plus') {
                item.qty = Number(item.qty) + 1;
            } else if (btn.dataset.action === 'minus') {
                item.qty = Number(item.qty) - 1;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }

            saveCart(cart);
            renderCart();
        });

        // ---- Инициализация ----
        renderCart();
    </script>

</body>
</html>
